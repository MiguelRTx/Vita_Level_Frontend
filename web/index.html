<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1D6B53">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ritmo: tu espacio para construir hábitos, cumplir actividades y alcanzar metas.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ritmo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ritmo · Tu espacio personal</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #f7f8f2; }
    #app-loading {
      position: fixed; inset: 0; display: grid; place-content: center;
      text-align: center; font: 16px system-ui, sans-serif; color: #193b31;
    }
    #app-loading h1 { font-size: 38px; margin: 0 0 14px; letter-spacing: -1.5px; }
    #app-loading p { margin: 8px 20px; }
    #app-loading button {
      margin: 16px auto; padding: 12px 24px; border: 0; border-radius: 12px;
      background: #1d6b53; color: white; font: inherit; cursor: pointer;
    }
    #app-loading [hidden] { display: none; }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <h1>ritmo</h1>
    <p id="loading-message">Preparando tu espacio…</p>
    <button id="loading-retry" hidden>Volver a intentar</button>
  </div>
  <noscript>Activa JavaScript en tu navegador para abrir Ritmo.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
